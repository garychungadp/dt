name: Security

# Push is enabled now. To also scan pull requests, uncomment pull_request.
on:
  push:
    branches: [main,development, testing, staging, production]
  workflow_dispatch:
  # pull_request:
  #   branches: [development, testing, staging, production]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Generate HTML Report for Secret Scan
        if: always()
        run: |
          python .github/scripts/generate-report.py results.sarif reports/secret-scan-report.html

      - name: Upload Secret Scan Reports (HTML & SARIF)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-reports
          path: |
            reports/secret-scan-report.html
            results.sarif

  sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended
          build-mode: manual
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build solution for CodeQL
        run: dotnet build dt.sln --configuration Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
          output: results

      - name: Generate HTML Report from SARIF
        run: |
          python .github/scripts/generate-report.py results/csharp.sarif reports/codeql-report.html

      - name: Upload Scan Reports (HTML & SARIF)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-reports
          path: |
            reports/codeql-report.html
            results/csharp.sarif

  dependency-scan:
    name: NuGet vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore solution
        run: dotnet restore dt.sln
      - name: Check vulnerable NuGet packages
        shell: bash
        run: |
          set -o pipefail
          dotnet list dt.sln package --vulnerable --include-transitive --format json | tee nuget-vulnerabilities.json
          if jq -e 'any(.. | objects; has("severity"))' nuget-vulnerabilities.json >/dev/null; then
            echo "Vulnerable NuGet package(s) found."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuget-vulnerability-report
          path: nuget-vulnerabilities.json

  license-scan:
    name: NuGet license report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Install license scanner
        run: dotnet tool install --global dotnet-project-licenses
      - name: Generate NuGet license report
        shell: bash
        env:
          DOTNET_ROLL_FORWARD: Major
        run: dotnet-project-licenses -i dt.sln -o nuget-licenses.csv -f CSV
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuget-license-report
          path: nuget-licenses.csv

  iac-scan:
    name: IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create reports directory
        run: mkdir -p reports

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: template
          template: '@.github/templates/html.tpl'
          output: reports/iac-scan-report.html
          severity: CRITICAL,HIGH

      - name: Upload IaC Scan Report (HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac-scan-reports
          path: reports/iac-scan-report.html
