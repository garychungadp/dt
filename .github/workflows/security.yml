name: Security

# Push is enabled now. To also scan pull requests, uncomment pull_request.
on:
  push:
    branches: [main,development, testing, staging, production]
  workflow_dispatch:
  # pull_request:
  #   branches: [development, testing, staging, production]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended
          build-mode: manual
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build solution for CodeQL
        run: dotnet build dt.sln --configuration Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
          output: results

      - name: Generate HTML Report from SARIF
        run: |
          python .github/scripts/generate-report.py results/csharp.sarif reports/codeql-report.html

      - name: Upload Scan Reports (HTML & SARIF)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-reports
          path: |
            reports/codeql-report.html
            results/csharp.sarif

