apiVersion: apps/v1
kind: Deployment
metadata:
  name: dt-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dt-api
  template:
    metadata:
      labels:
        app: dt-api
    spec:
      containers:
        - name: dt-api
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /weatherforecast
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dt-api
spec:
  selector:
    app: dt-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dt-api-ingress
spec:
  tls:
  - hosts:
    - dt-api-staging.space4m.com
    secretName: ingress-tls-secret
  ingressClassName: nginx
  rules:
    - host: dt-api-staging.space4m.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dt-api
                port:
                  number: 80
